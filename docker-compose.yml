version: '3.8'
services:
  crypto-sentinel:
    build: .
    container_name: crypto-sentinel
    volumes:
      - type: bind
        source: .
        target: /app
    environment:
      - TZ=Asia/Shanghai
      - IS_DOCKER=true
      - USE_PROXY=${USE_PROXY:-false}
      - PROXY_URL=${PROXY_URL:-http://host.docker.internal:7890}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
